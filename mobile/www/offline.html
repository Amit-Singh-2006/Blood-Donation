<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifeLink is offline</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
           background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; text-align: center; }
    .card { max-width: 360px; background: #fef2f2; border: 1px solid #fee2e2; border-radius: 24px; padding: 32px 24px; }
    svg { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #475569; margin: 0 0 20px; }
    .emergency { font-size: 13px; color: #b91c1c; font-weight: 700; margin: 16px 0 0; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #ee2b2b; color: #ffffff; font-size: 15px; font-weight: 800; }
    button:active { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 1024 1024" aria-hidden="true">
      <path fill="#ee2b2b" d="M512 170 C512 170 270 450 270 610 A242 242 0 0 0 754 610 C754 450 512 170 512 170 Z" />
      <polyline fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
                points="330,640 430,640 470,560 520,720 565,600 595,640 694,640" />
    </svg>
    <h1>You're offline</h1>
    <p>LifeLink needs an internet connection to show blood requests, campaigns and your donation pass. Check your connection and try again.</p>
    <button onclick="location.replace('https://blood-donation-frontend-delta.vercel.app/')">Try again</button>
    <p class="emergency">In a medical emergency, call 112 or 108.</p>
  </div>
</body>
</html>
